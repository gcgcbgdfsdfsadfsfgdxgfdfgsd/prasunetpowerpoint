server {
    listen 80;
    server_name powerpoint.prasunet.com;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    root /var/www/powerpoint.prasunet.com;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Correct MIME type for WebAssembly
    types {
        application/wasm wasm;
        text/html html;
        application/javascript js;
        text/css css;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
    }

    # Cross-Origin Isolation headers for WebAssembly / SharedArrayBuffer performance
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed WASM and static assets for 1 year
    location ~* \.(?:wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}

